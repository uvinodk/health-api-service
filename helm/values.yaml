replicaCount: 3

image:
  # ECR repository URL will be set by GitHub Actions at deploy time
  # Format: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/health-api-service
  repository: "PLACEHOLDER_ECR_REPO"
  pullPolicy: IfNotPresent
  tag: "latest"

namespace: health-api

service:
  type: LoadBalancer
  port: 8000
  targetPort: 8000

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
