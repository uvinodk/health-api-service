name: Deploy to App Runner (Terraform)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set image tag and account
        id: image_info
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_OUTPUT
      - name: Terraform init
        run: terraform -chdir=terraform init
      - name: Terraform apply (deploy App Runner)
        env:
          TF_VAR_image_tag: ${{ steps.image_info.outputs.IMAGE_TAG }}
        run: |
          terraform -chdir=terraform apply -auto-approve -var="image_tag=${{ steps.image_info.outputs.IMAGE_TAG }}"
